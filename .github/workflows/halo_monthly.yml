name: HALO 월간 포트폴리오 리포트

on:
  schedule:
    # 매월 25~27일 평일 00:00 UTC(09:00 KST) 트리거
    # 25일이 평일이면 25일, 토요일이면 27일(월), 일요일이면 26일(월)에만 실행
    - cron: '0 0 25-27 * 1-5'
  workflow_dispatch:        # GitHub Actions 탭에서 수동 실행 가능

permissions:
  contents: write           # state_v6.json / history_v6.csv / latest_report.json 커밋용
  issues: write             # 결과 댓글 게시용

jobs:
  portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: 실행 날짜 검증 (25일 평일 기준)
        id: check
        run: |
          DAY=$(date -u +%d)
          DOW=$(date -u +%u)   # 1=월 … 7=일
          RUN=false
          if   [ "$DAY" = "25" ]; then
            RUN=true            # 25일이 평일 → 바로 실행
          elif [ "$DAY" = "26" ] && [ "$DOW" = "1" ]; then
            RUN=true            # 26일 월요일 → 25일이 일요일이었음
          elif [ "$DAY" = "27" ] && [ "$DOW" = "1" ]; then
            RUN=true            # 27일 월요일 → 25일이 토요일이었음
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "오늘: $(date -u +'%Y-%m-%d') (요일=$DOW) → run=$RUN"

      - name: 코드 체크아웃
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: portfolio/requirements.txt

      - name: 패키지 설치
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r portfolio/requirements.txt

      - name: HALO v6.0 실행
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          MONTHLY_BASE_CASH: ${{ secrets.MONTHLY_BASE_CASH }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:         ${{ secrets.SMTP_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          IRP_MODE:          ${{ secrets.IRP_MODE }}
        run: python portfolio/halo_v6.py

      - name: 결과 요약 (GitHub Actions Summary + 챗창용)
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          try:
              with open("portfolio/data/latest_report.json", encoding="utf-8") as f:
                  r = json.load(f)
          except Exception as e:
              print(f"리포트 파일 읽기 실패: {e}", file=sys.stderr)
              sys.exit(0)

          mode_icon = "🟢" if r["mode"] == "OFFENSIVE" else "🔴"
          picks_str = " / ".join(p["name"] for p in r["picks"])
          order_rows = ""
          for o in r["orders"]:
              icon = "📈" if o["side"] == "BUY" else "📉"
              order_rows += f"| {icon} {o['side']} | {o['name']} | {o['shares']:,}주 | {o['price']:,.0f}원 | {o['amount']:,.0f}원 |\n"
          if not order_rows:
              order_rows = "| — | 주문 없음 | | | |\n"

          score_rows = ""
          for t, s in sorted(r["scores_pct"].items(), key=lambda x: -(x[1] or -9999)):
              icon = "▲" if (s or 0) >= 0 else "▼"
              score_str = f"{s:+.2f}%" if s is not None else "N/A"
              score_rows += f"| {t} | {icon} {score_str} |\n"

          summary = f"""## 📊 HALO v6 VAA 리포트 — {r["date"]}

          > 실행: {r["run_at"]}  |  {'전체 리밸런싱' if r["rebalanced"] else '매수 전용'}

          ### {mode_icon} {r["mode"]} 모드
          **선택 ETF:** {picks_str}

          | 지표 | 값 |
          |---|---|
          | NAV | **{r["nav"]:,}원** |
          | 포트폴리오 DD | {r["port_dd_pct"]:+.2f}% |
          | SPY DD | {r["spy_dd_pct"]:+.2f}% |
          | VIX | {r["vix"] or "N/A"} |
          | 투입 | {r["cash"]:,}원 |
          | 집행 | {r["used"]:,}원 |
          | 미집행 | {r["leftover"]:,}원 |

          ### 주문 내역
          | 구분 | 종목 | 수량 | 단가 | 금액 |
          |---|---|---|---|---|
          {order_rows}
          ### VAA 모멘텀 점수
          | 티커 | 점수 |
          |---|---|
          {score_rows}
          """
          summary = "\n".join(line.strip() for line in summary.splitlines())

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary)
          print(summary)
          PYEOF

      - name: 변경 파일 자동 커밋
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "HALO Bot"
          git config user.email "actions@github.com"
          git add portfolio/data/state_v6.json portfolio/data/history_v6.csv \
                  portfolio/data/latest_report.json
          git diff --staged --quiet || \
            git commit -m "chore: HALO v6 $(date +'%Y-%m') 월간 업데이트 [skip ci]"
          git push
